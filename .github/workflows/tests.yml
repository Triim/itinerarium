name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # composer.lock requires PHP >= 8.4.1 (symfony/*, spatie/image).
      # gd is MediaLibrary's default image driver, used for Place conversions.
      # memory_limit restores PHP's stock default (setup-php otherwise sets -1),
      # so CI runs under the same limit as local development and would expose,
      # not hide, any memory regression.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, exif, fileinfo, gd, iconv, mbstring, pdo_sqlite, sqlite3, xml, zip
          ini-values: memory_limit=128M
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint frontend
        run: npx eslint .

      - name: Check frontend formatting
        run: npm run format:check

      # Also produces the Vite manifest that Inertia page tests rely on.
      - name: Build frontend
        run: npm run build

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Only APP_KEY is taken from here; phpunit.xml forces the testing
      # environment (in-memory SQLite, array cache/session/mail, sync queue).
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit
